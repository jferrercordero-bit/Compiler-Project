<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="712" font-family="Inter, Helvetica, Arial, sans-serif" viewBox="0 0 760 712" role="img" aria-label="Diagrama de flujo del escaneo" font-size="13"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="flow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9a9a90"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#1c1c1a">El escáner repite un ciclo por lexema hasta agotar la entrada</text><text x="24" y="50" font-size="11.5" fill="#5c5c57">Diagrama de flujo del algoritmo de escaneo</text><g><path d="M330 120V140" fill="none" stroke="#9a9a90" stroke-width="1.25" marker-end="url(#flow-arrow)"></path><path d="M220 172H196" fill="none" stroke="#9a9a90" stroke-width="1.25" marker-end="url(#flow-arrow)"></path><path d="M330 204V228" fill="none" stroke="#9a9a90" stroke-width="1.25" marker-end="url(#flow-arrow)"></path><path d="M330 284V304" fill="none" stroke="#9a9a90" stroke-width="1.25" marker-end="url(#flow-arrow)"></path><path d="M440 336H504" fill="none" stroke="#9a9a90" stroke-width="1.25" marker-end="url(#flow-arrow)"></path><path d="M330 368V392" fill="none" stroke="#9a9a90" stroke-width="1.25" marker-end="url(#flow-arrow)"></path><path d="M330 448V468" fill="none" stroke="#9a9a90" stroke-width="1.25" marker-end="url(#flow-arrow)"></path><path d="M440 500H504" fill="none" stroke="#9a9a90" stroke-width="1.25" marker-end="url(#flow-arrow)"></path><path d="M330 532V556" fill="none" stroke="#9a9a90" stroke-width="1.25" marker-end="url(#flow-arrow)"></path><path d="M330 612V632" fill="none" stroke="#9a9a90" stroke-width="1.25" marker-end="url(#flow-arrow)"></path><path d="M480 660H728V172H440" fill="none" stroke="#9a9a90" stroke-width="1.25" marker-end="url(#flow-arrow)"></path><path d="M694 336H728" fill="none" stroke="#9a9a90" stroke-width="1.25"></path><path d="M694 500H728" fill="none" stroke="#9a9a90" stroke-width="1.25"></path></g><g><rect x="180" y="72" width="300" height="48" rx="8" fill="none" stroke="#9a9a90" stroke-width="1.25"></rect><text x="330" y="100" text-anchor="middle" fill="#1c1c1a">Leer la entrada y normalizar comillas</text></g><g><polygon points="220,172 330,140 440,172 330,204" fill="none" stroke="#9a9a90" stroke-width="1.25"></polygon><text x="330" y="176" text-anchor="middle" fill="#1c1c1a">¿Quedan caracteres?</text></g><g><rect x="24" y="140" width="172" height="64" rx="24" fill="none" stroke="#9a9a90" stroke-width="1.25"></rect><text x="110" y="167" text-anchor="middle" fill="#1c1c1a">Imprimir tokens,</text><text x="110" y="185" text-anchor="middle" fill="#1c1c1a">total y errores</text></g><g><rect x="180" y="228" width="300" height="56" rx="8" fill="none" stroke="#9a9a90" stroke-width="1.25"></rect><text x="330" y="251" text-anchor="middle" fill="#1c1c1a">Recorrer el AFD desde q0 y guardar</text><text x="330" y="269" text-anchor="middle" fill="#1c1c1a">el último estado final visitado</text></g><g><polygon points="220,336 330,304 440,336 330,368" fill="none" stroke="#9a9a90" stroke-width="1.25"></polygon><text x="330" y="340" text-anchor="middle" fill="#1c1c1a">¿Hubo estado final?</text></g><g><rect x="504" y="304" width="190" height="64" rx="8" fill="none" stroke="#9a9a90" stroke-width="1.25"></rect><text x="599" y="331" text-anchor="middle" fill="#1c1c1a">Reportar error léxico</text><text x="599" y="349" text-anchor="middle" fill="#1c1c1a">y saltar (modo pánico)</text></g><g><rect x="180" y="392" width="300" height="56" rx="8" fill="none" stroke="#9a9a90" stroke-width="1.25"></rect><text x="330" y="415" text-anchor="middle" fill="#1c1c1a">Cortar el lexema y retroceder</text><text x="330" y="433" text-anchor="middle" fill="#1c1c1a">a la posición guardada</text></g><g><polygon points="220,500 330,468 440,500 330,532" fill="none" stroke="#9a9a90" stroke-width="1.25"></polygon><text x="330" y="504" text-anchor="middle" fill="#1c1c1a">¿Espacio o comentario?</text></g><g><rect x="504" y="476" width="190" height="48" rx="8" fill="none" stroke="#9a9a90" stroke-width="1.25"></rect><text x="599" y="505" text-anchor="middle" fill="#1c1c1a">Descartar</text></g><g><rect x="180" y="556" width="300" height="56" rx="8" fill="none" stroke="#9a9a90" stroke-width="1.25"></rect><text x="330" y="579" text-anchor="middle" fill="#1c1c1a">Clasificar: tabla de búsqueda si viene</text><text x="330" y="597" text-anchor="middle" fill="#1c1c1a">de q1; si no, según el estado final</text></g><g><rect x="180" y="632" width="300" height="56" rx="8" fill="none" stroke="#9a9a90" stroke-width="1.25"></rect><text x="330" y="655" text-anchor="middle" fill="#1c1c1a">Agregar token con línea y columna;</text><text x="330" y="673" text-anchor="middle" fill="#1c1c1a">identificadores a la tabla de símbolos</text></g><text x="208" y="162" text-anchor="middle" font-size="11.5" fill="#5c5c57">no</text><text x="340" y="220" font-size="11.5" fill="#5c5c57">sí</text><text x="472" y="326" text-anchor="middle" font-size="11.5" fill="#5c5c57">no</text><text x="340" y="384" font-size="11.5" fill="#5c5c57">sí</text><text x="472" y="490" text-anchor="middle" font-size="11.5" fill="#5c5c57">sí</text><text x="340" y="548" font-size="11.5" fill="#5c5c57">no</text><text x="590" y="164" text-anchor="middle" font-size="11.5" fill="#5c5c57">siguiente lexema</text></svg>
