<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="616" font-family="Inter, Helvetica, Arial, sans-serif" viewBox="0 0 760 616" role="img" aria-label="Etapas del lexer" font-size="13"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="arch-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9a9a90"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#1c1c1a">El lexer ejecuta cinco etapas en orden; dos servicios son compartidos</text><text x="24" y="50" font-size="11.5" fill="#5c5c57">Cada caja es una clase; entre paréntesis, su capa en Modelo-Vista-Controlador</text><g><rect x="24" y="64" width="380" height="528" rx="8" fill="#efefeb" stroke="#9a9a90" stroke-width="1.25"></rect><text x="40" y="88" font-weight="600" fill="#1c1c1a">LexerController (controlador)</text><text x="40" y="106" font-size="11.5" fill="#5c5c57">Ejecuta cada etapa en orden y reúne tokens y errores</text></g><g><rect x="40" y="120" width="348" height="72" rx="8" fill="#ffffff" stroke="#9a9a90" stroke-width="1.25"></rect><text x="52" y="144" font-weight="600" fill="#1c1c1a">InputReader (vista)</text><text x="52" y="160" font-size="11.5" fill="#1c1c1a">Lee la cadena (--text) o el archivo (--file)</text><text x="52" y="176" font-size="11.5" fill="#1c1c1a">y entrega el texto al controlador</text></g><path d="M214 192V216" fill="none" stroke="#9a9a90" stroke-width="1.25" marker-end="url(#arch-arrow)"></path><g><rect x="40" y="216" width="348" height="72" rx="8" fill="#ffffff" stroke="#9a9a90" stroke-width="1.25"></rect><text x="52" y="240" font-weight="600" fill="#1c1c1a">Preprocessor (modelo)</text><text x="52" y="256" font-size="11.5" fill="#1c1c1a">Cambia las comillas tipográficas por rectas</text><text x="52" y="272" font-size="11.5" fill="#1c1c1a">y conserva la numeración de líneas y columnas</text></g><path d="M214 288V312" fill="none" stroke="#9a9a90" stroke-width="1.25" marker-end="url(#arch-arrow)"></path><g><rect x="40" y="312" width="348" height="72" rx="8" fill="#ffffff" stroke="#9a9a90" stroke-width="1.25"></rect><text x="52" y="336" font-weight="600" fill="#1c1c1a">Scanner (modelo)</text><text x="52" y="352" font-size="11.5" fill="#1c1c1a">Recorre el AFD de 25 estados con su tabla</text><text x="52" y="368" font-size="11.5" fill="#1c1c1a">máximo bocado; retrocede al último estado final</text></g><path d="M214 384V408" fill="none" stroke="#9a9a90" stroke-width="1.25" marker-end="url(#arch-arrow)"></path><g><rect x="40" y="408" width="348" height="72" rx="8" fill="#ffffff" stroke="#9a9a90" stroke-width="1.25"></rect><text x="52" y="432" font-weight="600" fill="#1c1c1a">TokenClassifier (modelo)</text><text x="52" y="448" font-size="11.5" fill="#1c1c1a">Asigna el TokenType según el estado final</text><text x="52" y="464" font-size="11.5" fill="#1c1c1a">y consulta la tabla de búsqueda para q1</text></g><path d="M214 480V504" fill="none" stroke="#9a9a90" stroke-width="1.25" marker-end="url(#arch-arrow)"></path><g><rect x="40" y="504" width="348" height="72" rx="8" fill="#ffffff" stroke="#9a9a90" stroke-width="1.25"></rect><text x="52" y="528" font-weight="600" fill="#1c1c1a">OutputFormatter (vista)</text><text x="52" y="544" font-size="11.5" fill="#1c1c1a">Imprime la secuencia y una línea Class: lexeme</text><text x="52" y="560" font-size="11.5" fill="#1c1c1a">por token; al final, Total of tokens: N</text></g><path d="M388 348H480" fill="none" stroke="#9a9a90" stroke-width="1.25" marker-end="url(#arch-arrow)"></path><path d="M388 444H480" fill="none" stroke="#9a9a90" stroke-width="1.25" marker-end="url(#arch-arrow)"></path><g><rect x="480" y="312" width="256" height="72" rx="8" fill="#ffffff" stroke="#9a9a90" stroke-width="1.25"></rect><text x="492" y="336" font-weight="600" fill="#1c1c1a">ErrorHandler (modelo)</text><text x="492" y="352" font-size="11.5" fill="#1c1c1a">Mensaje y recuperación según</text><text x="492" y="368" font-size="11.5" fill="#1c1c1a">el estado donde se atora (5.4)</text></g><g><rect x="480" y="408" width="256" height="72" rx="8" fill="#ffffff" stroke="#9a9a90" stroke-width="1.25"></rect><text x="492" y="432" font-weight="600" fill="#1c1c1a">SymbolTable (modelo)</text><text x="492" y="448" font-size="11.5" fill="#1c1c1a">insert() y lookup() por cada</text><text x="492" y="464" font-size="11.5" fill="#1c1c1a">identificador; el tipo va después</text></g></svg>
